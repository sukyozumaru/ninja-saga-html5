<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Ninja Saga · Cliente histórico</title>
<style>body{margin:0;background:#151515;color:#ddd;font:14px system-ui;text-align:center}header{padding:12px}a{color:#d7b078}#game{width:1000px;height:650px;max-width:100vw;margin:0 auto}ruffle-player{width:100%;height:100%}</style>
<header>Cliente histórico 3.3.00810 · Restauración en curso · <a href="/registration.html" target="_blank">Crear cuenta local</a></header>
<div id="game"></div>
<script>
const localOrigin = location.origin;
for(const type of ['warn','error','info']) {
 const original = console[type].bind(console);
 console[type] = (...args) => {original(...args);const message=args.map(String).join(' ');fetch('/client-log',{method:'POST',body:message}).catch(()=>{});};
}
window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',splashScreen:false,upgradeToHttps:false,allowScriptAccess:false,openUrlMode:'allow',compatibilityRules:false,logLevel:'info',urlRewriteRules:[[/^https?:\/\/[^/]+\/(.*)$/,localOrigin+'/$1']]}};
</script><script src="/ruffle/ruffle.js"></script><script>
window.addEventListener('DOMContentLoaded', async()=> {
 const player=window.RufflePlayer.newest().createPlayer();document.querySelector('#game').appendChild(player);
 // No fb_uid, fb_at, fb_sig, or community bootstrap parameters.
 await player.ruffle().load({url:localOrigin+'/mirror/http://static.ninjasaga.com/swf/3.3.00810/ninja_saga.swf',parameters:{lang:'en',client_version:'3.3.00810'}});
});
</script></html>
