<!doctype html><html lang="es"><meta charset="utf-8"><title>Cuenta local · Ninja Saga</title>
<style>body{max-width:480px;margin:10vh auto;padding:24px;background:#171717;color:#eee;font:16px system-ui}label{display:block;margin:20px 0}input,button{font:inherit;padding:10px}input{display:block;width:90%}a{color:#dbb778}</style>
<h1>Cuenta local</h1><p>Esta cuenta pertenece únicamente a la restauración en tu ordenador. Después podrás entrar desde la pantalla original del juego.</p>
<form method="post" action="/accounts"><label>Usuario<input name="username" pattern="[A-Za-z0-9_.]{3,32}" minlength="3" maxlength="32" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><button>Crear cuenta local</button></form>
<p><a href="/">Volver al juego</a></p><p>Recuperación de contraseña aún pendiente. No utilices contraseñas de otros servicios.</p></html>
