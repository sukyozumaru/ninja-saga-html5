<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ninja Saga · Prueba pública</title>
<style>body{margin:0;background:#151515;color:#ddd;font:14px system-ui;text-align:center}header{padding:12px;line-height:1.6}a{color:#d7b078}#game{width:1000px;height:650px;max-width:100vw;margin:0 auto}ruffle-player{width:100%;height:100%}p{margin:4px}</style>
<header><strong>Ninja Saga · Restauración histórica</strong><p>Prueba de acceso y selección de personajes. Creación y misiones todavía en restauración.</p><a href="/registration.html">Crear cuenta de pruebas</a> · <a href="https://github.com/sukyozumaru/ninja-saga-html5/issues" target="_blank" rel="noopener">Reportar un problema</a></header>
<div id="game"></div><p id="status" role="status">Cargando el cliente histórico…</p>
<script>
const origin=location.origin;
window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',splashScreen:false,upgradeToHttps:false,allowScriptAccess:false,openUrlMode:'allow',compatibilityRules:false,logLevel:'warn',urlRewriteRules:[[/^https?:\/\/[^/]+\/amf_live1\/?(?:\?.*)?$/,origin+'/api/amf'],[/^https?:\/\/[^/]+\/(.*)$/,origin+'/$1']]}};
</script><script src="/ruffle/ruffle.js"></script><script>
window.addEventListener('DOMContentLoaded',async()=>{try{
 const player=window.RufflePlayer.newest().createPlayer();document.querySelector('#game').appendChild(player);
 // The unchanged client checks loaderURL for its original host string.
 await player.ruffle().load({url:origin+'/swf/3.3.00810/ninja_saga.swf?preserved_host=http://static.ninjasaga.com/',parameters:{lang:'en',client_version:'3.3.00810'}});
 document.querySelector('#status').textContent='Entra con tu cuenta de pruebas en la pantalla original del juego.';
}catch{document.querySelector('#status').textContent='No se pudo cargar el cliente. Recarga la página o reporta el problema.';}});
</script></html>
